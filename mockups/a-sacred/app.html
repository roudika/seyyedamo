<!doctype html>
<html lang="fa" dir="rtl" data-default-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F17">
<meta name="color-scheme" content="dark light">
<script src="../assets/theme.js"></script>
<title>اپ کاروان رفع دلتنگی · صفحه‌های PWA · نسخه شبِ حرم</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="board-page">
<script src="system.js"></script>

<header class="wrap board-head" style="max-width:1900px">
  <div style="display:flex;align-items:center;gap:18px">
    <span class="logo" style="--d:60px" aria-hidden="true"></span>
    <h1>اپ کاروان رفع دلتنگی</h1>
    <span style="margin-inline-start:auto"><button class="theme-btn" type="button" data-theme-toggle aria-label="تغییر حالت روشن و تیره"><svg class="ic t-sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="ic t-moon" aria-hidden="true"><use href="#i-moon2"/></svg></button></span>
  </div>
  <p>نسخه «شبِ حرم»: همان زمین سبز شب و خط طلایی سایت، آرام‌تر برای گوشی. تزئین فقط در سرصفحه‌ها؛ فرم‌ها روی برگه عاجی با متن تیره تا برای چشم همه خوانا بماند.</p>
</header>

<main class="wrap board" style="max-width:1900px">

  <!-- 1. HOME -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar"><span>۹:۴۱</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="app-top">
        <span class="logo" style="--d:40px" aria-hidden="true"></span>
        <div><h1 style="font-size:24px">کاروان رفع دلتنگی</h1><span class="sub">سلام، زائر عزیز</span></div>
        <button class="icon-btn" style="margin-inline-start:auto" aria-label="اعلان‌ها"><svg class="ic"><use href="#i-bell"/></svg></button>
      </div>
      <div class="app-body">
        <div class="install-banner">
          <svg class="ic ic-l" style="color:var(--gold-light)"><use href="#i-download"/></svg>
          <p><b>اپ را روی گوشی نصب کنید</b>بدون استور، با یک لمس</p>
          <button class="btn">نصب</button>
        </div>
        <h2 class="a-h3">کاروان‌های این هفته <span>ویژه میلاد حضرت زینب (س)</span></h2>

        <article class="tcard">
          <div class="arch"><div class="arch-photo"><img src="../assets/img/husayn-tasnim.jpg" alt=""></div><svg class="arch-line"></svg></div>
          <div>
            <h3>کاروان هتلی درجه ب</h3>
            <p class="meta">کربلا ۴ روزه · ۲۱ تا ۲۴ مهر</p>
            <div class="row"><span class="lamps" data-left="5" data-of="8"></span><span class="seat-note" style="font-size:13.5px">۵ نفر</span></div>
            <div class="row"><span class="price">۱۳٬۸۰۰٬۰۰۰<small>تومان</small></span><a class="btn" href="#" style="min-height:44px;padding:0 16px">رزرو</a></div>
          </div>
        </article>

        <article class="tcard is-full">
          <div class="arch"><div class="arch-photo"><img src="../assets/img/Karbala.jpg" alt=""></div><svg class="arch-line"></svg></div>
          <div>
            <h3>کاروان هتلی درجه الف</h3>
            <p class="meta">کربلا ۴ روزه · ۲۱ تا ۲۴ مهر</p>
            <div class="row"><span class="lamps" data-left="0" data-of="8"></span><span class="seat-note full" style="font-size:13.5px">پر شد</span></div>
            <div class="row"><span class="price">۱۷ میلیون <small>تومان</small></span><a class="btn btn-ghost" href="#" style="min-height:44px;padding:0 12px">هفته بعد</a></div>
          </div>
          <svg class="seal" role="img" aria-label="تکمیل"><use href="#seal"/></svg>
        </article>

        <article class="tcard">
          <div class="arch"><div class="arch-photo"><img src="../assets/img/abbas-bayn-alharamayn.jpg" alt="" style="object-position:45% 60%"></div><svg class="arch-line"></svg></div>
          <div>
            <h3>سفر اقتصادی ۴۸ ساعته</h3>
            <p class="meta">چهارشنبه ۲۲ مهر، ساعت ۱۳:۰۰</p>
            <div class="row"><span class="lamps" data-left="5" data-of="8"></span><span class="tag tag-crimson" style="font-size:12.5px;padding:0 8px">۵۰٪ زائر اولی</span></div>
            <div class="row"><span class="price">۸٬۵۰۰٬۰۰۰<small>تومان</small></span><a class="btn" href="#" style="min-height:44px;padding:0 16px">رزرو</a></div>
          </div>
        </article>
      </div>
      <nav class="tabbar" aria-label="منوی اپ">
        <a class="tab" aria-current="page" href="#"><svg class="ic"><use href="#i-home"/></svg>خانه</a>
        <a class="tab" href="#"><svg class="ic"><use href="#i-map"/></svg>تورها</a>
        <a class="tab" href="#"><svg class="ic"><use href="#i-ticket"/></svg>سفرهای من</a>
        <a class="tab" href="#"><svg class="ic"><use href="#i-user"/></svg>پروفایل</a>
      </nav>
    </div></div>
    <figcaption><b>۱. خانه</b>کاروان‌های این هفته با چراغ صندلی‌ها؛ هر قندیل روشن یک صندلی خالی است.</figcaption>
  </figure>

  <!-- 2. TOUR DETAIL -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar on-photo"><span>۹:۴۲</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="detail-hero">
        <div class="arch"><div class="arch-photo"><img src="../assets/img/najaf-2023.jpg" alt="حرم امام علی (ع) در نجف" style="object-position:50% 35%"></div></div>
        <div class="float-top"><button class="icon-btn" aria-label="بازگشت"><svg class="ic"><use href="#i-back"/></svg></button><button class="icon-btn" aria-label="اشتراک"><svg class="ic"><use href="#i-send"/></svg></button></div>
        <div class="detail-title">
          <span class="tag tag-gold" style="background:rgba(11,31,23,.7)">ویژه شهادت حضرت زهرا (س)</span>
          <h2>کاروان هتلی درجه الف</h2>
          <p>کربلا ۴ روزه · فاطمیه اول</p>
        </div>
      </div>
      <div class="app-body" style="padding-top:12px">
        <div class="facts">
          <div><svg class="ic"><use href="#i-cal"/></svg><p><b>رفت</b><span>سه‌شنبه صبح ۲۸ مهر</span></p></div>
          <div><svg class="ic"><use href="#i-cal"/></svg><p><b>برگشت</b><span>جمعه صبح ۱ آبان</span></p></div>
          <div><svg class="ic"><use href="#i-bed"/></svg><p><b>هتل درجه الف</b><span>۲ شب کربلا، فول‌برد</span></p></div>
          <div><svg class="ic"><use href="#i-bus"/></svg><p><b>اتوبوس VIP</b><span>با غذای مسیر</span></p></div>
        </div>
        <h3 class="a-h3" style="margin-top:14px">برنامه سفر</h3>
        <ol class="days">
          <li><b>سه‌شنبه ۲۸ مهر، صبح</b><span>حرکت با اتوبوس VIP، غذای مسیر رفت</span></li>
          <li><b>در مسیر</b><span>زیارت عبوری حرم امیرالمؤمنین (ع) در نجف</span></li>
          <li><b>دو شب در کربلا</b><span>اسکان در هتل الف، صبحانه و ناهار و شام، زیارت حرمین</span></li>
          <li><b>جمعه ۱ آبان، صبح</b><span>برگشت، غذای مسیر برگشت</span></li>
        </ol>
        <div style="display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gold-hair)">
          <span class="lamps" data-left="8" data-of="8"></span><span class="seat-note" style="font-size:14px">ظرفیت باز</span><span class="tag tag-sample" style="margin-inline-start:auto">نمونه</span>
        </div>
      </div>
      <div class="sticky-buy">
        <div><span class="lbl">هزینه هر نفر</span><span class="price">۱۷٬۳۰۰٬۰۰۰<small>تومان</small></span></div>
        <a class="btn btn-lg" href="#">رزرو</a>
      </div>
    </div></div>
    <figcaption><b>۲. جزئیات تور</b>تاریخ‌ها، هتل، اتوبوس و برنامه سفر؛ قیمت و دکمه رزرو همیشه پایین صفحه.</figcaption>
  </figure>

  <!-- 3. LOGIN -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar"><span>۹:۴۳</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="login-art" style="background:var(--facets) 0 0 / 24px 24px">
        <div class="arch tall"><div class="arch-photo"><img src="../assets/img/karbala2.jpg" alt="" style="transform:scale(1.15);transform-origin:72% 40%"></div><svg class="arch-line" data-arch="tall"></svg></div>
      </div>
      <div class="sheet">
        <h2>ورود یا ثبت‌نام</h2>
        <p class="lede">شماره موبایلتان را وارد کنید تا کد تأیید برایتان پیامک شود.</p>
        <div class="field">
          <label for="ph">شماره موبایل</label>
          <div class="phone-row">
            <span class="cc">+۹۸</span>
            <input id="ph" class="input ltr is-focus" type="tel" inputmode="numeric" autocomplete="tel" value="۰۹۱۲ ۳۴۵ ۶۷۸۹">
          </div>
          <span class="hint">بدون فاصله یا با فاصله، فرقی نمی‌کند.</span>
        </div>
        <div class="push">
          <button class="btn btn-lg btn-block">دریافت کد تأیید</button>
          <p class="fine">با ورود، <a href="#">قوانین کاروان</a> را می‌پذیرید. مشکل در ورود؟ پیام به ۰۹۰۰۱۵۴۲۰۳۰</p>
        </div>
      </div>
    </div></div>
    <figcaption><b>۳. ورود با موبایل</b>بدون رمز عبور؛ فقط شماره موبایل و کد پیامکی.</figcaption>
  </figure>

  <!-- 4. OTP -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar"><span>۹:۴۳</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="app-top"><button class="icon-btn" aria-label="بازگشت"><svg class="ic"><use href="#i-back"/></svg></button></div>
      <div class="otp-art" aria-hidden="true"><svg><use href="#star8"/></svg></div>
      <div class="sheet">
        <h2>کد تأیید را وارد کنید</h2>
        <p class="lede">کد ۶ رقمی به شماره <bdi style="font-weight:700;color:var(--ink)">۰۹۱۲ ••• ۶۷۸۹</bdi> پیامک شد. <a href="#">ویرایش شماره</a></p>
        <div class="field">
          <span class="label" id="otp-l">کد تأیید</span>
          <div class="otp" role="group" aria-labelledby="otp-l"><span>۴</span><span>۸</span><span>۲</span><span class="is-focus"></span><span></span><span></span></div>
        </div>
        <div class="resend"><span>کد نرسید؟</span><span>ارسال دوباره تا <b>۰۱:۴۲</b></span></div>
        <div class="push">
          <button class="btn btn-lg btn-block" disabled>تأیید و ورود</button>
          <p class="fine">کد پس از ۲ دقیقه منقضی می‌شود.</p>
        </div>
      </div>
    </div></div>
    <figcaption><b>۴. کد پیامکی</b>شش خانه بزرگ؛ کیبورد عددی خودکار باز می‌شود و کد پیامک خودکار پر می‌شود.</figcaption>
  </figure>

  <!-- 5. TRAVELERS -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar"><span>۹:۴۵</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="stepper-head">
        <div class="row"><button class="icon-btn" aria-label="بازگشت"><svg class="ic"><use href="#i-back"/></svg></button><div><h2>مسافران</h2><span class="of">مرحله ۲ از ۴ · کاروان درجه ب، ۲۱ مهر</span></div></div>
        <div class="progress" aria-hidden="true"><i class="done"></i><i class="done"></i><i></i><i></i></div>
      </div>
      <div class="sheet form">
        <div class="form-scroll">
          <div class="count-row"><div><b>تعداد مسافران</b><small>۵ صندلی خالی در این کاروان</small></div>
            <div class="count"><button aria-label="کم کردن"><svg class="ic"><use href="#i-minus"/></svg></button><output>۲</output><button aria-label="اضافه کردن"><svg class="ic"><use href="#i-plus"/></svg></button></div></div>
          <div class="trav">
            <div class="trav-h"><b>مسافر ۱ · سرپرست</b></div>
            <div class="field"><label for="n1">نام و نام خانوادگی</label><input id="n1" class="input" value="فاطمه رضایی" autocomplete="name"></div>
            <div class="field"><label for="c1">کد ملی</label><input id="c1" class="input ltr is-err" inputmode="numeric" value="۰۰۱۲۳۴۵۶۷"><span class="err"><svg class="ic ic-s"><use href="#i-alert"/></svg>کد ملی ۱۰ رقم است؛ یک رقم کم دارد.</span></div>
            <div class="field"><span class="label">جنسیت</span><div class="seg" role="radiogroup"><span class="on" role="radio" aria-checked="true">زن</span><span role="radio" aria-checked="false">مرد</span></div></div>
            <div class="toggle-row"><div><b>زائر اولی هستم</b><small>اولین سفر کربلا؛ برای کمک‌هزینه بررسی می‌شود</small></div><span class="switch on" role="switch" aria-checked="true" aria-label="زائر اولی"></span></div>
          </div>
          <div class="trav" style="padding-bottom:4px"><div class="trav-h" style="padding-bottom:6px"><b>مسافر ۲ · علی رضایی</b><a href="#" style="font-size:14px;min-height:44px;display:flex;align-items:center;gap:4px"><svg class="ic ic-s"><use href="#i-edit"/></svg>ویرایش</a></div></div>
          <div class="field" style="margin-top:12px"><span class="label">چیدمان اتاق</span><div class="seg" role="radiogroup"><span class="on" role="radio" aria-checked="true">خانوادگی، یک اتاق</span><span role="radio" aria-checked="false">اتاق مشترک هم‌جنس</span></div></div>
        </div>
      </div>
      <div class="form-foot"><button class="btn btn-ghost">قبلی</button><button class="btn">ادامه: گذرنامه</button></div>
    </div></div>
    <figcaption><b>۵. مسافران</b>تعداد، نام، کد ملی، جنسیت، زائر اولی و چیدمان اتاق. خطا کنار همان خانه و به زبان ساده.</figcaption>
  </figure>

  <!-- 6. PASSPORT -->
  <figure class="shot">
    <div class="device"><div class="screen">
      <div class="statusbar"><span>۹:۴۷</span><span class="sb-icons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg></span></div>
      <div class="stepper-head">
        <div class="row"><button class="icon-btn" aria-label="بازگشت"><svg class="ic"><use href="#i-back"/></svg></button><div><h2>گذرنامه</h2><span class="of">مرحله ۳ از ۴ · ۲ مسافر</span></div></div>
        <div class="progress" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="done"></i><i></i></div>
      </div>
      <div class="sheet form">
        <div class="form-scroll">
          <div class="trav" style="margin-top:0">
            <div class="trav-h"><b>فاطمه رضایی</b><span style="font-size:13px;color:#2F5A2A;font-weight:700;display:flex;gap:4px;align-items:center"><svg class="ic ic-s"><use href="#i-check"/></svg>کامل</span></div>
            <div class="field-row">
              <div class="field"><label for="p1">شماره گذرنامه</label><input id="p1" class="input ltr" value="K12345678" autocapitalize="characters"></div>
              <div class="field"><label for="e1">تاریخ انقضا</label><input id="e1" class="input ltr" inputmode="numeric" value="۱۴۰۷/۰۵/۱۲"></div>
            </div>
            <div class="uploaded"><span class="thumb" aria-hidden="true"></span><div><b>عکس صفحه اول</b><small><svg class="ic ic-s"><use href="#i-check"/></svg>بارگذاری شد</small></div><a class="chg" href="#">عوض کردن</a></div>
          </div>
          <div class="trav">
            <div class="trav-h"><b>علی رضایی</b></div>
            <div class="field-row">
              <div class="field"><label for="p2">شماره گذرنامه</label><input id="p2" class="input ltr" autocapitalize="characters"></div>
              <div class="field"><label for="e2">تاریخ انقضا</label><input id="e2" class="input ltr" inputmode="numeric" placeholder="۱۴۰۶/۰۱/۰۱"></div>
            </div>
            <div class="upload" role="button" tabindex="0"><svg class="ic"><use href="#i-camera"/></svg><b>عکس صفحه اول گذرنامه</b><small>عکس بگیرید یا از گالری انتخاب کنید</small></div>
          </div>
          <p class="fine" style="text-align:start;display:flex;gap:8px"><svg class="ic ic-s" style="flex:none;margin-top:3px;color:var(--gold-deep)"><use href="#i-shield"/></svg>گذرنامه باید تا ۶ ماه بعد از سفر اعتبار داشته باشد. تصویرها فقط برای ویزا استفاده می‌شوند.</p>
        </div>
      </div>
      <div class="form-foot"><button class="btn btn-ghost">قبلی</button><button class="btn">ادامه: بازبینی</button></div>
    </div></div>
    <figcaption><b>۶. گذرنامه</b>یک مسافر کامل با عکس بارگذاری‌شده، یکی هنوز خالی.</figcaption>
  </figure>

  <!-- 7. HELD -->
