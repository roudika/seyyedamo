<!doctype html>
<html lang="fa" dir="rtl" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b141c">
<title>نسخه B «صحن»: صفحه‌های اپ کاروان رفع دلتنگی</title>
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  :root { --board: #e6eae8; --bezel: #16222c; --bezel-hi: #3a4954; --tab-bg: rgba(255,255,255,.9); --sticky-bg: rgba(255,255,255,.94); --tab-ink: #5d6b74; --step-off: #d4dcdb; --otp-fill: #9fb3b2; --drop-line: #a9bebd; --scrim-bg: rgba(9, 22, 31, 0.42); }
  html[data-theme="dark"] { --board: #070d12; --bezel: #26343f; --bezel-hi: #3f505c; --tab-bg: rgba(17,29,39,.9); --sticky-bg: rgba(17,29,39,.94); --tab-ink: #97a8b0; --step-off: #26363f; --otp-fill: #3f5560; --drop-line: #2f5d63; --scrim-bg: rgba(0, 0, 0, 0.6); }
  body { background: var(--board); }
  .board-head { width: min(1760px, 100% - 64px); margin: 56px auto 40px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .board-head h1 { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1.2; margin: 0; }
  .board-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
  .board { width: min(1760px, 100% - 64px); margin: 0 auto 96px; display: flex; flex-wrap: wrap; gap: 56px 40px; justify-content: center; }
  .shot { margin: 0; width: 410px; }
  .shot figcaption { margin-top: 18px; text-align: center; font-size: 16px; color: var(--ink-2); line-height: 1.7; }
  .shot figcaption b { display: block; color: var(--ink); font-size: 17px; }

  /* device */
  .phone { width: 410px; height: 864px; padding: 10px; border-radius: 62px; background: var(--bezel); box-shadow: 0 1px 0 var(--bezel-hi) inset, 0 40px 80px -36px rgba(15,30,43,.55), 0 10px 24px -12px rgba(15,30,43,.35); }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--ground); display: flex; flex-direction: column; }
  .status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; font-size: 16px; font-weight: 700; position: relative; z-index: 5; }
  .status .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #0b1218; }
  .status .sys { display: flex; gap: 6px; align-items: center; direction: ltr; }
  .status .sys svg { width: 62px; height: 12px; fill: currentColor; }
  .status.on-photo { position: absolute; inset: 0 0 auto 0; color: #fff; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 9; }
  .home-ind.light { background: var(--surface); }

  .body { flex: 1; overflow: hidden; padding: 4px 20px 34px; display: flex; flex-direction: column; }
  .body > * { flex-shrink: 0; }
  .appbar { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 8px; }
  .appbar h2 { margin: 0; font-size: 19px; font-weight: 800; flex: 1; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--sh-1); display: grid; place-items: center; color: var(--ink); flex: none; position: relative; }
  .round .dot { position: absolute; top: 9px; left: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--low); box-shadow: 0 0 0 2px var(--surface); }
  .title { font-family: var(--f-display); font-weight: 700; font-size: 2.3rem; line-height: 1.25; margin: 6px 0 6px; }

  /* tab bar */
  .tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 30px; background: var(--tab-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .tabs.three { grid-template-columns: repeat(3, 1fr); }
  .tab { display: grid; justify-items: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--tab-ink); min-height: 52px; padding-top: 4px; position: relative; }
  .tab .ic { width: 25px; height: 25px; }
  .tab.on { color: var(--tq-deep); }
  .tab .badge { position: absolute; top: 0; left: calc(50% - 22px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--low); color: var(--on-low); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

  /* home */
  .brandline { display: flex; align-items: center; gap: 10px; }
  .brandline img { width: 36px; height: 40px; object-fit: contain; mix-blend-mode: var(--logo-blend); background: var(--logo-bg); border-radius: 10px; }
  .brandline b { font-family: var(--f-display); font-size: 22px; line-height: 1; }
  .install-b { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--tq-tint); color: var(--tq-ink); font-size: 14.5px; line-height: 1.6; margin: 6px 0 16px; }
  .install-b .ic { color: var(--tq); }
  .install-b button { margin-inline-start: auto; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--tq); color: var(--on-tq); font-weight: 700; font-size: 14px; }
  .strip { display: flex; gap: 8px; overflow: hidden; margin: 0 -20px 16px; padding: 4px 20px 8px; }
  .sday { flex: 0 0 66px; border-radius: 18px; padding: 8px 6px 10px; text-align: center; background: transparent; }
  .sday .w { font-size: 12.5px; color: var(--ink-3); display: block; }
  .sday .d { font-size: 24px; font-weight: 800; line-height: 1.25; display: block; font-feature-settings: "tnum"; }
  .sday .dots { display: flex; justify-content: center; gap: 3px; height: 6px; margin-top: 2px; }
  .sday .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .sday.has { background: var(--surface); box-shadow: var(--sh-1); }
  .sday.off .d { color: var(--ink-4); font-weight: 500; }
  .sday.on { background: var(--tq); color: var(--on-tq); box-shadow: 0 10px 20px -10px rgba(10,94,102,.7); }
  .sday.on .w { color: var(--on-tq); }
  .h3 { font-size: 17px; font-weight: 800; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .h3 span { font-size: 14px; font-weight: 500; color: var(--ink-3); }
  .tcard { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--sh-1); margin-bottom: 12px; align-items: center; }
  .tcard img { width: 92px; height: 104px; border-radius: 15px; object-fit: cover; }
  .tcard h3 { margin: 0; font-size: 16.5px; font-weight: 800; line-height: 1.5; }
  .tcard .sub { font-size: 13.5px; color: var(--ink-3); line-height: 1.6; }
  .tcard .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .tcard .p { font-size: 17px; }
  .tcard .p small { font-size: 12px; font-weight: 500; color: var(--ink-3); }
  .tcard.is-full { opacity: .78; }
  .seats { font-size: 13.5px; gap: 7px; }
  .seats .ticks i { width: 5px; height: 12px; border-radius: 2px; }

  /* detail */
  .d-hero { position: relative; height: 300px; flex: none; }
  .d-hero img { width: 100%; height: 100%; object-fit: cover; }
  .d-hero .ctrl { position: absolute; top: 58px; inset-inline: 18px; display: flex; justify-content: space-between; }
  .d-sheet { position: relative; margin-top: -30px; background: var(--ground); border-radius: 30px 30px 0 0; flex: 1; overflow: hidden; padding: 22px 20px 0; }
  .d-sheet h2 { font-family: var(--f-display); font-size: 31px; line-height: 1.25; margin: 0; }
  .facts3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 16px; }
  .facts3 div { background: var(--surface); border-radius: 16px; padding: 10px 8px; text-align: center; font-size: 13px; color: var(--ink-2); line-height: 1.5; box-shadow: var(--sh-1); }
  .facts3 .ic { color: var(--tq); display: block; margin: 0 auto 4px; }
  .itin { list-style: none; margin: 0; padding: 0; }
  .itin li { position: relative; padding: 0 28px 12px 0; font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }
  .itin li::before { content: ""; position: absolute; right: 4px; top: 8px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--tq); background: var(--surface); }
  .itin li::after { content: ""; position: absolute; right: 8.5px; top: 22px; bottom: -2px; width: 1px; background: var(--line-2); }
  .itin li:last-child::after { display: none; }
  .itin b { color: var(--ink); display: block; font-size: 15px; }
  .sticky { position: absolute; inset: auto 0 0 0; padding: 14px 20px 34px; background: var(--sticky-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; z-index: 6; }
  .sticky .p { font-size: 20px; line-height: 1.2; }
  .sticky .p small { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
  .sticky .btn { flex: 1; }

  /* forms */
  .steps-ind { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 2px 0 6px; }
  .steps-ind i { height: 5px; border-radius: 3px; background: var(--step-off); }
  .steps-ind i.on { background: var(--tq); }
  .step-l { font-size: 14px; color: var(--ink-3); font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 12px; }
  .step-l b { color: var(--tq-deep); }
  .ctx { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface); border-radius: 14px; font-size: 14px; color: var(--ink-2); box-shadow: var(--sh-1); margin-bottom: 14px; }
  .ctx .ic { color: var(--tq); }
  .fcard { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--sh-1); display: grid; gap: 12px; margin-bottom: 12px; }
  .fcard h3 { margin: 0; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .input { min-height: 54px; }
  .ltr-in { direction: ltr; text-align: right; }
  .line-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .line-row .t { font-weight: 700; font-size: 15.5px; }
  .line-row .t small { display: block; font-weight: 500; font-size: 13px; color: var(--ink-3); }
  .done-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-1); font-size: 15px; margin-bottom: 12px; }
  .done-row .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--tq-tint); color: var(--tq-deep); display: grid; place-items: center; }
  .done-row .ic-chev { margin-inline-start: auto; color: var(--ink-3); }
  .radio { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line-2); font-size: 15px; font-weight: 600; }
  .radio i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--mute-bar-2); flex: none; }
  .radio.on { border-color: var(--tq); background: var(--tq-tint-2); }
  .radio.on i { border: 7px solid var(--tq); }
  .bottom-cta { margin-top: auto; padding-top: 12px; }
  .gold-star { width: 18px; height: 18px; color: var(--gold); }

  /* otp */
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; direction: ltr; margin: 26px 0 14px; }
  .otp span { height: 62px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; font-size: 27px; font-weight: 800; }
  .otp span.fill { border-color: var(--otp-fill); }
  .otp span.cur { border-color: var(--tq); box-shadow: 0 0 0 4px var(--ring); }
  .otp span.cur::after { content: ""; width: 2px; height: 28px; background: var(--tq); border-radius: 2px; }

  /* upload */
  .drop { border: 2px dashed var(--drop-line); border-radius: 22px; padding: 22px 16px; text-align: center; background: var(--tq-tint-2); display: grid; justify-items: center; gap: 6px; }
  .drop .cam { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); color: var(--tq); display: grid; place-items: center; box-shadow: var(--sh-1); margin-bottom: 4px; }
  .drop b { font-size: 16px; }
  .drop p { margin: 0; font-size: 14px; color: var(--ink-3); line-height: 1.7; }
  .drop .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
  .drop .two .btn { min-height: 48px; font-size: 15px; padding: 0 10px; }
  .uploaded { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 20px; background: var(--surface); box-shadow: var(--sh-1); }
  .pp { width: 112px; height: 80px; border-radius: 10px; background: #233a4d; position: relative; overflow: hidden; }
  .pp::before { content: ""; position: absolute; inset: 10px auto 10px 10px; width: 34px; border-radius: 4px; background: #c9d5dc; }
  .pp::after { content: ""; position: absolute; left: 52px; right: 10px; top: 14px; height: 40px; background: repeating-linear-gradient(#8ea3b1 0 4px, transparent 4px 10px); }
  .pp i { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 8px; background: repeating-linear-gradient(90deg, #8ea3b1 0 3px, transparent 3px 5px); }
  .ptabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .ptabs span { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; background: var(--surface); font-size: 14.5px; font-weight: 700; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .ptabs span.on { box-shadow: inset 0 0 0 2px var(--tq); color: var(--tq-ink); background: var(--tq-tint-2); }
  .ptabs .ic { width: 18px; height: 18px; color: var(--tq); }
  .lock-note { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-3); line-height: 1.7; margin-top: 12px; }
  .lock-note .ic { color: var(--tq); width: 18px; height: 18px; margin-top: 3px; }

  /* held */
  .held { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 24px; background: var(--surface); box-shadow: var(--sh-2); margin-bottom: 14px; }
  .ring { position: relative; width: 112px; height: 112px; }
  .ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bg { stroke: var(--tq-tint); }
  .ring .fg { stroke: var(--tq); stroke-linecap: round; stroke-dasharray: 314; stroke-dashoffset: 4; }
  .ring .t { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.2; }
  .ring .t b { font-size: 22px; font-feature-settings: "tnum"; }
  .ring .t span { font-size: 11.5px; color: var(--ink-3); }
  .held h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; line-height: 1.5; }
  .held p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.7; }
  .sum { background: var(--surface); border-radius: 20px; padding: 6px 16px; box-shadow: var(--sh-1); margin-bottom: 12px; }
  .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .sum div:last-child { border: 0; }
  .sum dt, .sum span:first-child { color: var(--ink-3); }
  .sum .tot { font-size: 17px; }
  .cardno { background: var(--field-deep); color: #fff; border-radius: 20px; padding: 16px 18px; margin-bottom: 12px; position: relative; }
  .cardno .l { font-size: 13px; color: #cfe9ea; display: flex; justify-content: space-between; align-items: center; }
  .cardno .n { direction: ltr; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .06em; margin: 8px 0 4px; font-feature-settings: "tnum"; }
  .cardno .who { font-size: 13.5px; color: #e0f2f2; display: flex; justify-content: space-between; align-items: center; }
  .copy { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-size: 13px; font-weight: 700; border: 0; }
  .copy .ic { width: 16px; height: 16px; }
  .cardno .chip-sample { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }

  /* trips */
  .trip { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--sh-1); margin-bottom: 12px; }
  .trip .top { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .trip h3 { margin: 0; font-size: 16.5px; font-weight: 800; line-height: 1.5; }
  .trip .sub { font-size: 13.5px; color: var(--ink-3); }
  .trip .act { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); gap: 10px; }
  .trip .act .btn { min-height: 44px; padding: 0 16px; font-size: 15px; }
  .chip .ic { width: 16px; height: 16px; }

  /* admin */
  .arow { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--sh-1); margin-bottom: 10px; }
  .arow .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .arow h3 { margin: 0; font-size: 15.5px; font-weight: 800; line-height: 1.5; }
  .arow .sub { font-size: 13px; color: var(--ink-3); }
  .arow .ct { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .arow .ct .lab { font-size: 13.5px; color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
  .arow .stepper button { width: 40px; height: 40px; }
  .arow .stepper output { font-size: 19px; min-width: 34px; }
  .neworder { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-1); margin-bottom: 10px; font-size: 14px; }
  .neworder .av { width: 40px; height: 40px; border-radius: 50%; background: var(--tq-tint); color: var(--tq-deep); display: grid; place-items: center; font-weight: 800; flex: none; }
  .neworder .btn { min-height: 40px; padding: 0 14px; font-size: 14px; margin-inline-start: auto; border-radius: 12px; }
  .neworder b { display: block; font-size: 15px; }
  .neworder span { color: var(--ink-3); font-size: 13px; }

  /* bottom sheet */
  .scrim { position: absolute; inset: 0; background: var(--scrim-bg); z-index: 7; }
  .sheet { position: absolute; inset: auto 0 0 0; z-index: 8; background: var(--surface-2); border-radius: 30px 30px 0 0; padding: 10px 22px 40px; box-shadow: 0 -20px 50px -20px rgba(9,22,31,.5); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 14px; }
  .sheet h3 { font-family: var(--f-display); font-size: 29px; margin: 0 0 2px; line-height: 1.3; }
  .sheet .stepper button { width: 52px; height: 52px; }
  .sheet .stepper output { font-size: 28px; min-width: 56px; }
  .sheet .stepper .ic { width: 24px; height: 24px; }
  .bigline { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .bigline:last-of-type { border: 0; }

  @media (max-width: 900px) { .board-head { display: block; } }
  @media (max-width: 480px) { .board-head, .board { width: calc(100% - 24px); } .board-head { margin-top: 28px; } .board-head h1 { font-size: 2rem; } .board { gap: 40px; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".9"/><circle cx="16" cy="14.5" r=".9"/></symbol>

    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 4.8a3.2 3.2 0 0 1 0 6.4M18 14.8c1.9.7 3 2.5 3 5.2"/></symbol>
